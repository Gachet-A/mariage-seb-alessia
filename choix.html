<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Deux versions · Alessia &amp; Sébastien</title>
  <link rel="icon" href="images/favicon.ico">
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    :root {
      --paper: #f7f3f3; --ink: #191009; --ink-soft: #5e4c3e; --rule: rgb(25 16 9 / 0.2);
      --f-display: "Archivo", "Arial Narrow", sans-serif; --f-text: "Spectral", Georgia, serif;
      --gutter: clamp(1rem, 4vw, 3.5rem);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-text); font-size: 1.0625rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    ::selection { background: #d2996c; color: var(--ink); }
    :focus-visible { outline: 2px solid #9a5f33; outline-offset: 3px; }
    header { padding: clamp(2rem, 5vw, 4rem) var(--gutter) 2rem; border-bottom: 1px solid var(--rule); }
    h1 {
      margin: 0; font-family: var(--f-display); font-stretch: 68%; font-weight: 750; text-transform: uppercase;
      font-size: clamp(2.5rem, 7vw, 5rem); line-height: 1; letter-spacing: -0.01em; text-wrap: balance;
    }
    h1 span { font-family: var(--f-text); font-style: italic; font-weight: 300; text-transform: none; color: #9a5f33; }
    header p { margin: 1rem 0 0; max-width: 46ch; color: var(--ink-soft); }
    main { display: grid; gap: 3rem; padding: 2.5rem var(--gutter) 4rem; }
    @media (min-width: 900px) { main { grid-template-columns: 1fr 1fr; gap: clamp(2rem, 4vw, 4rem); } }
    .variant { display: grid; gap: 1.25rem; justify-items: center; }
    .variant-head { width: 100%; max-width: 430px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--ink); }
    h2 { margin: 0; font-family: var(--f-display); font-stretch: 75%; font-weight: 700; text-transform: uppercase; font-size: 1.5rem; letter-spacing: 0.01em; }
    .swatches { display: flex; gap: 0.35rem; }
    .swatches i { width: 1.1rem; height: 1.1rem; border: 1px solid var(--rule); }
    .device {
      width: 100%; max-width: 430px; height: min(78svh, 860px);
      border: 1px solid var(--rule); border-radius: 22px; overflow: hidden; background: #fff;
      box-shadow: 0 24px 50px -28px rgb(25 16 9 / 0.35);
    }
    .device iframe { width: 100%; height: 100%; border: 0; display: block; }
    .open {
      display: inline-flex; align-items: center; gap: 1.25rem; min-height: 3rem; padding: 0 1.25rem;
      font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 0.9375rem; letter-spacing: 0.08em; text-transform: uppercase;
      text-decoration: none; color: var(--ink); border: 1px solid var(--ink);
      transition: background-color 160ms ease, color 160ms ease, transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .open:active { transform: scale(0.97); }
    @media (hover: hover) { .open:hover { background: var(--ink); color: var(--paper); } }
  </style>
</head>
<body>
  <header>
    <h1>Alessia <span>&amp;</span> Sébastien</h1>
    <p>Deux palettes pour le même site. Faites défiler chaque aperçu, ou ouvrez-le en plein écran.</p>
  </header>
  <main>
    <section class="variant" aria-labelledby="v1">
      <div class="variant-head">
        <h2 id="v1">Clair</h2>
        <div class="swatches" aria-hidden="true"><i style="background:#f7f3f3"></i><i style="background:#cec8c3"></i><i style="background:#d2996c"></i><i style="background:#191009"></i></div>
      </div>
      <div class="device"><iframe src="./" title="Aperçu de la version claire" loading="lazy"></iframe></div>
      <a class="open" href="./">Ouvrir en plein écran
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"/></svg></a>
    </section>
    <section class="variant" aria-labelledby="v2">
      <div class="variant-head">
        <h2 id="v2">Vert</h2>
        <div class="swatches" aria-hidden="true"><i style="background:#dccaa8"></i><i style="background:#1d3a2a"></i><i style="background:#13281c"></i><i style="background:#c9922a"></i></div>
      </div>
      <div class="device"><iframe src="./?theme=vert" title="Aperçu de la version verte" loading="lazy"></iframe></div>
      <a class="open" href="./?theme=vert">Ouvrir en plein écran
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"/></svg></a>
    </section>
  </main>
</body>
</html>
